<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokoro - Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: #000;
            color: #00ffff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .kokoro-badge {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #00ffff, #0055ff);
            border-radius: 50%;
            margin-bottom: 10px;
            box-shadow: 0 0 30px #00ffff;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px #00ffff; }
            50% { box-shadow: 0 0 60px #00ffff; }
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .status { font-size: 12px; color: #00aa00; }

        .chat {
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 15px;
            background: rgba(0, 255, 255, 0.05);
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-message {
            background: rgba(0, 150, 255, 0.2);
            text-align: right;
            border-left: 2px solid #0099ff;
        }
        .kokoro-message {
            background: rgba(0, 255, 255, 0.1);
            border-left: 2px solid #00ffff;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #00ffff;
            border-radius: 5px;
            font-size: 14px;
        }
        input::placeholder { color: #0099ff; }
        input:focus {
            outline: none;
            box-shadow: 0 0 10px #00ffff;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #0055ff, #00ffff);
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            box-shadow: 0 0 20px #00ffff;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }

        .voice-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .voice-btn.listening {
            background: #ff4444;
            animation: vibrate 0.3s ease-in-out infinite;
        }
        @keyframes vibrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .devices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .device {
            padding: 15px;
            background: rgba(0, 150, 255, 0.1);
            border: 1px solid #0099ff;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .device:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 10px #0099ff;
        }
        .device-icon { font-size: 24px; margin-bottom: 5px; }
        .device-name { font-size: 12px; color: #0099ff; }
        .device.online .device-name::before { content: "🟢 "; }
        .device.offline .device-name::before { content: "🔴 "; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="kokoro-badge"></div>
            <h1>Kokoro</h1>
            <div class="status" id="status">Connecting...</div>
        </div>

        <div class="chat" id="chat"></div>

        <div class="input-area">
            <input type="text" id="input" placeholder="Tell Kokoro..." />
            <button id="sendBtn">Send</button>
            <button class="voice-btn" id="voiceBtn">🎤</button>
        </div>

        <div class="devices" id="devices">
            <div class="device online">
                <div class="device-icon">🔷</div>
                <div class="device-name">Pyramid</div>
            </div>
            <div class="device online">
                <div class="device-icon">💾</div>
                <div class="device-name">Victus</div>
            </div>
            <div class="device online">
                <div class="device-icon">🛡️</div>
                <div class="device-name">Kali</div>
            </div>
            <div class="device online">
                <div class="device-icon">📱</div>
                <div class="device-name">RasPad</div>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const status = document.getElementById('status');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';

        let kokoroUrl = 'http://localhost:5000';
        let isListening = false;

        // Check if we're on RasPad
        if (window.location.hostname !== 'localhost') {
            kokoroUrl = `http://${window.location.hostname}:5000`;
        }

        async function connectToKokoro() {
            try {
                const response = await fetch(`${kokoroUrl}/api/health`);
                if (response.ok) {
                    status.textContent = '✓ Connected';
                    status.style.color = '#00ff00';
                } else {
                    status.textContent = '⚠ Offline';
                    status.style.color = '#ffaa00';
                }
            } catch (e) {
                status.textContent = '✗ Disconnected';
                status.style.color = '#ff4444';
            }
        }

        async function sendMessage(text) {
            if (!text.trim()) return;

            addMessage(text, 'user');
            input.value = '';

            try {
                const response = await fetch(`${kokoroUrl}/api/talk`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, is_owner: false })
                });

                const data = await response.json();
                addMessage(data.response, 'kokoro');

                // Speak response
                speak(data.response);
            } catch (e) {
                addMessage('I seem to have lost connection...', 'kokoro');
            }
        }

        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}-message`;
            msg.textContent = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 1.2;
                speechSynthesis.speak(utterance);
            }
        }

        sendBtn.addEventListener('click', () => sendMessage(input.value));
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(input.value);
        });

        voiceBtn.addEventListener('click', () => {
            isListening = !isListening;
            if (isListening) {
                voiceBtn.classList.add('listening');
                recognition.start();
            } else {
                voiceBtn.classList.remove('listening');
                recognition.stop();
            }
        });

        recognition.onresult = (e) => {
            let text = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
                text += e.results[i][0].transcript;
            }
            if (text) sendMessage(text);
        };

        // Connect on load
        connectToKokoro();
        setInterval(connectToKokoro, 5000);
    </script>
</body>
</html>
